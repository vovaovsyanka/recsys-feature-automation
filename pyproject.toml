[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recsys"
version = "0.1.0"
description = "Автоматизация построения признаков в рекомендательных системах: Yambda и KION"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
